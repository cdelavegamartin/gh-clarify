# GitHub Actions workflow for automated code-clarification review
#
# IMPORTANT: This is a template file. Copy it to .github/workflows/ in your
# target repository, since GitHub Actions only runs workflows from that exact
# path. Do not symlink it — GitHub Actions does not follow symlinks.
#
# Prerequisites:
#  1. GitHub Discussions must be enabled (repo Settings → General → Features)
#  2. Required labels must exist: "code-clarification" and "bot-answered"
#     (run `gh clarify setup-labels` once, or see the gh-clarify README)
#  3. Q&A category must exist (created by default when Discussions is enabled)
#
# The workflow:
#  - Runs on a daily schedule (default: 3am UTC, adjust `cron` below)
#  - Can also be triggered manually via workflow_dispatch
#  - Installs the gh-clarify extension (gh extension install)
#  - Checks if Discussions is enabled (stops cleanly if not)
#  - Invokes Copilot CLI in non-interactive autopilot mode with the prompt
#    from `gh clarify prompt`
#  - Uses the cheapest available model (claude-haiku-4.5) to keep costs low
#
# Authentication: Uses GitHub's built-in GITHUB_TOKEN, which has read access
# by default but needs explicit `discussions: write` permission (declared below).
#
# Copilot CLI authentication: The workflow assumes the Copilot CLI can
# authenticate using GITHUB_TOKEN. If your organization requires a separate
# Copilot-specific token, add a repository secret named COPILOT_CLI_TOKEN
# (Settings → Secrets → Actions) and uncomment the alternative env block below.

name: Code clarifications review

on:
  # Run daily at 3am UTC (off-peak). Adjust hour/minute to your timezone:
  schedule:
    - cron: '0 3 * * *'

  # Allow manual triggering for on-demand runs:
  workflow_dispatch:

# IMPORTANT: The default GITHUB_TOKEN does NOT include discussions: write.
# You must declare it explicitly:
permissions:
  contents: read       # Read repo code
  discussions: write   # Post answers, mark answered, add labels
  issues: write

jobs:
  review-clarifications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install gh-clarify extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh extension install cdelavegamartin/gh-clarify

      - name: Check if Discussions is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fail fast if Discussions is disabled for this repo
          gh clarify check-enabled --require
          echo "Discussions is enabled, proceeding..."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Copilot CLI
        run: |
          # Install the GitHub Copilot CLI agent from npm
          # This is the @github/copilot package that provides the `copilot` binary
          # with -p/--prompt, --mode, --allow-all-tools, etc.
          #
          # Note: This is NOT the same as `gh copilot` (GitHub CLI's command
          # suggestion extension). We need the full agent CLI for autopilot mode.
          npm install -g @github/copilot
          copilot --version

      - name: Run code-clarification review
        env:
          # Use GitHub's built-in token for authentication:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Alternative: If your org requires a separate Copilot token,
          # uncomment the line below and add COPILOT_CLI_TOKEN to repo secrets:
          # COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
        run: |
          # Get the prompt body from the gh-clarify extension (single source
          # of truth, kept in sync with the extension's own subcommands):
          PROMPT=$(gh clarify prompt)

          # Invoke Copilot CLI in non-interactive autopilot mode:
          # - -p: execute the prompt non-interactively (verified flag)
          # - --mode autopilot: run unattended without human approval (verified flag)
          # - --allow-all-tools: auto-approve all tool calls (verified flag, required for non-interactive)
          # - --model claude-haiku-4.5: use the cheapest available model per workflow-prompt.md
          #   (flag verified, but model ID itself is unverified — `copilot --help` doesn't
          #   enumerate valid model IDs. If this fails, try 'auto' or check your org's
          #   available models via the Copilot app's /model command)
          # - --silent: output only the agent response, suppress stats (verified flag)
          #
          # All flags verified against `copilot --help` from @github/copilot version 1.0.79-2:
          # - `-p, --prompt <text>` documented as "Execute a prompt in non-interactive mode"
          # - `--mode <mode>` with choices "interactive", "plan", "autopilot"
          # - `--allow-all-tools` documented as "Allow all tools to run automatically without confirmation"
          # - `--model <model>` documented as "Set the AI model to use"
          # - `-s, --silent` documented as "Output only the agent response (no stats), useful for scripting with -p"
          #
          # Authentication: The CLI uses GITHUB_TOKEN from the environment by default.
          # See `copilot help environment` for precedence order (COPILOT_GITHUB_TOKEN > GH_TOKEN > GITHUB_TOKEN).

          copilot -p "$PROMPT" \
            --mode autopilot \
            --model claude-haiku-4.5 \
            --allow-all-tools \
            --silent || {
              echo "ERROR: Copilot CLI invocation failed."
              echo "This may indicate:"
              echo "  - Authentication failed (check GITHUB_TOKEN permissions)"
              echo "  - The model 'claude-haiku-4.5' is not recognized by the CLI"
              echo "    (try replacing with 'auto' or check available models)"
              echo "  - npm install -g @github/copilot failed (check install step)"
              echo ""
              echo "See the 'Install Copilot CLI' step above for troubleshooting."
              exit 1
            }

          echo "Code-clarification review completed."
